<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>하렌 노래책 관리</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f6f3fb;
        color: #3b1d6a;
      }
      #gate {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border: 1px solid rgba(59, 29, 106, 0.15);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 8px 24px rgba(59, 29, 106, 0.08);
      }
      .card h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }
      .card p {
        margin: 0 0 20px;
        color: rgba(59, 29, 106, 0.65);
        font-size: 0.95rem;
        line-height: 1.5;
      }
      #gate label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.9rem;
        font-weight: 600;
      }
      #gate input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid rgba(59, 29, 106, 0.2);
        border-radius: 10px;
        font-size: 1rem;
        margin-bottom: 16px;
      }
      #gate button,
      #gate .back-link {
        width: 100%;
        padding: 12px 14px;
        border: none;
        border-radius: 10px;
        font-size: 0.95rem;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
        display: block;
      }
      #submit {
        background: #3b1d6a;
        color: #fff;
        margin-bottom: 12px;
      }
      #gate .back-link {
        background: rgba(59, 29, 106, 0.08);
        color: #3b1d6a;
      }
      #error {
        color: #b42318;
        font-size: 0.9rem;
        min-height: 1.2em;
        margin-bottom: 12px;
      }
      #notice {
        padding: 12px 16px;
        background: rgba(59, 29, 106, 0.08);
        border-bottom: 1px solid rgba(59, 29, 106, 0.12);
        font-size: 0.9rem;
        line-height: 1.5;
      }
      #notice .notice-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }
      #notice .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(59, 29, 106, 0.1);
        color: #3b1d6a;
        font-weight: 600;
        text-decoration: none;
        font-size: 0.85rem;
        white-space: nowrap;
        width: auto;
      }
      #notice .back-link:hover,
      #gate .back-link:hover {
        background: rgba(59, 29, 106, 0.18);
      }
      #notice a {
        color: #3b1d6a;
        font-weight: 600;
      }
      #notice strong {
        color: #3b1d6a;
      }
      #nc-root section button {
        width: auto !important;
        min-width: 200px;
        max-width: 100%;
        height: auto !important;
        padding: 12px 28px !important;
        font-size: 14px !important;
        line-height: 1.4 !important;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="gate">
      <div class="card">
        <h1>노래책 관리</h1>
        <p>노래 수정은 관리자 비밀번호가 필요합니다.</p>
        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" />
        <div id="error"></div>
        <button id="submit" type="button">입장</button>
        <a href="/" class="back-link">← 노래책으로 돌아가기</a>
      </div>
    </div>

    <div id="notice" hidden>
      <div class="notice-row">
        <a href="/" class="back-link">← 노래책으로 돌아가기</a>
      </div>
      <strong>노래책 전용 수정 페이지입니다.</strong>
      노래방 아카이브는
      <a href="/archive-admin">/archive-admin</a>에서 별도 관리합니다.
    </div>
    <div id="nc-root"></div>

    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
    <script>
      const GATE_KEY = "cms_songs_gate_ok";
      const NOTICE_READY_HTML =
        '<div class="notice-row"><a href="/" class="back-link">← 노래책으로 돌아가기</a></div>' +
        "<strong>노래책 전용 수정 페이지입니다.</strong> " +
        "노래방 아카이브는 " +
        '<a href="/archive-admin">/archive-admin</a>에서 별도 관리합니다.';

      const ADMIN_PATH = "/admin";
      const AUTH_PATH = "admin/auth";

      function isLocalHost() {
        return (
          window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1"
        );
      }

      function onReady(callback) {
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", callback);
        } else {
          callback();
        }
      }

      function ensureHashRoute() {
        if (!window.location.hash || window.location.hash === "#") {
          history.replaceState(
            null,
            "",
            window.location.pathname + window.location.search + "#/"
          );
        }
      }

      function clearCmsAuth() {
        for (const key of Object.keys(localStorage)) {
          if (
            key.includes("decap-cms") ||
            key.includes("netlify-cms") ||
            key.includes("github")
          ) {
            localStorage.removeItem(key);
          }
        }
      }

      function configureBackend(config) {
        config.site_url = `${window.location.origin}${ADMIN_PATH}`;
        config.backend.base_url = window.location.origin;
        config.backend.auth_endpoint = AUTH_PATH;
      }

      function isCmsAuthenticated(root) {
        if (
          root.querySelector("a[href*='collections']") ||
          root.querySelector("[class*='CollectionMain']") ||
          root.querySelector("[class*='AppMainContainer']") ||
          root.querySelector("[class*='Sidebar']") ||
          root.querySelector("nav")
        ) {
          return true;
        }

        const loginBtn = root.querySelector("button");
        return (
          !loginBtn &&
          root.children.length > 0 &&
          root.textContent.trim().length > 20
        );
      }

      function waitForCmsReady(timeoutMs) {
        return new Promise((resolve, reject) => {
          const deadline = Date.now() + timeoutMs;
          const timer = setInterval(() => {
            const root = document.getElementById("nc-root");
            if (!root) return;

            if (isCmsAuthenticated(root)) {
              clearInterval(timer);
              resolve("ready");
              return;
            }

            if (root.querySelector("button")) {
              clearInterval(timer);
              resolve("login");
              return;
            }

            if (Date.now() > deadline) {
              clearInterval(timer);
              reject(new Error("timeout"));
            }
          }, 100);
        });
      }

      function waitForGithubAuthSuccess(timeoutMs) {
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            window.removeEventListener("message", onMessage);
            reject(new Error("auth timeout"));
          }, timeoutMs);

          function onMessage(event) {
            if (
              typeof event.data === "string" &&
              event.data.indexOf("authorization:github:success:") === 0
            ) {
              clearTimeout(timer);
              window.removeEventListener("message", onMessage);
              resolve(true);
            }
          }

          window.addEventListener("message", onMessage);
        });
      }

      function triggerCmsLogin() {
        const loginBtn = document.querySelector("#nc-root button");
        if (!loginBtn) return false;
        loginBtn.click();
        return true;
      }

      async function authenticateCms(notice) {
        let state = await waitForCmsReady(10000);
        if (state === "ready") return true;

        const authSuccess = waitForGithubAuthSuccess(30000);

        if (!triggerCmsLogin()) {
          notice.textContent = "CMS 로그인 버튼을 찾지 못했습니다.";
          return false;
        }

        try {
          await authSuccess;
          await new Promise((resolve) => setTimeout(resolve, 400));
          state = await waitForCmsReady(20000);
          return state === "ready";
        } catch {
          return false;
        }
      }

      async function startAdmin() {
        ensureHashRoute();

        const gate = document.getElementById("gate");
        const notice = document.getElementById("notice");
        gate.hidden = true;
        notice.hidden = false;
        clearCmsAuth();

        const response = await fetch(`${ADMIN_PATH}/config.yml`);
        if (!response.ok) throw new Error("config load failed");

        const config = jsyaml.load(await response.text());

        if (isLocalHost()) {
          config.local_backend = { url: "http://localhost:8081/api/v1" };
          notice.textContent = "CMS를 불러오는 중...";
        } else {
          configureBackend(config);
          notice.textContent = "저장소에 연결 중... 잠시만 기다려 주세요.";
        }

        CMS.init({ config });

        if (!isLocalHost()) {
          const ok = await authenticateCms(notice);
          if (!ok) {
            notice.textContent =
              "CMS 인증에 실패했습니다. 잠시 후 다시 시도해 주세요.";
            return;
          }
        }

        notice.innerHTML = NOTICE_READY_HTML;
      }

      function bindGate() {
        const submitBtn = document.getElementById("submit");
        const passwordInput = document.getElementById("password");
        const errorEl = document.getElementById("error");

        submitBtn.addEventListener("click", async () => {
          errorEl.textContent = "";

          try {
            const response = await fetch("/api/cms-songs-gate", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ password: passwordInput.value }),
            });

            if (!response.ok) {
              errorEl.textContent = "비밀번호가 올바르지 않습니다.";
              return;
            }

            sessionStorage.setItem(GATE_KEY, "1");
            await startAdmin();
          } catch {
            errorEl.textContent = "인증 요청에 실패했습니다.";
          }
        });

        passwordInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            submitBtn.click();
          }
        });
      }

      onReady(function () {
        bindGate();

        if (sessionStorage.getItem(GATE_KEY)) {
          startAdmin().catch(function () {
            sessionStorage.removeItem(GATE_KEY);
            document.getElementById("gate").hidden = false;
            document.getElementById("notice").hidden = true;
            document.getElementById("notice").textContent =
              "CMS를 불러오지 못했습니다. 비밀번호를 다시 입력해 주세요.";
          });
        }
      });
    </script>
  </body>
</html>
