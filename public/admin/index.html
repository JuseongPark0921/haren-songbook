<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>하렌 노래책 관리</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f6f3fb;
        color: #3b1d6a;
      }
      #notice {
        padding: 12px 16px;
        background: rgba(59, 29, 106, 0.08);
        border-bottom: 1px solid rgba(59, 29, 106, 0.12);
        font-size: 0.9rem;
        line-height: 1.5;
      }
      #notice a {
        color: #3b1d6a;
        font-weight: 600;
      }
      #notice strong {
        color: #3b1d6a;
      }

      #nc-root section button {
        width: auto !important;
        min-width: 200px;
        max-width: 100%;
        height: auto !important;
        padding: 12px 28px !important;
        font-size: 14px !important;
        line-height: 1.4 !important;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="notice">
      <strong>노래책 전용 수정 페이지입니다.</strong>
      GitHub 개인 계정 없이 바로 수정할 수 있습니다. 노래방 아카이브는
      <a href="/archive-admin">/archive-admin</a>에서 별도 관리합니다.
    </div>
    <div id="nc-root"></div>

    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
    <script>
      const SONGS_ADMIN_PATH = "/admin";
      const REPO = "JuseongPark0921/haren-songbook";
      const AUTH_ENDPOINT = "/api/songs/auth";
      const TOKEN_HINT =
        "Vercel에 GITHUB_CMS_TOKEN(또는 GITHUB_SONGS_TOKEN)을 설정한 뒤 재배포하세요.";

      function isLocalHost() {
        return (
          window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1"
        );
      }

      function onReady(callback) {
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", callback);
        } else {
          callback();
        }
      }

      function ensureHashRoute() {
        if (!window.location.hash || window.location.hash === "#") {
          window.location.replace(
            window.location.pathname + window.location.search + "#/"
          );
        }
      }

      function clearCmsAuth() {
        for (const key of Object.keys(localStorage)) {
          if (
            key.includes("decap-cms") ||
            key.includes("netlify-cms") ||
            key.includes("github")
          ) {
            localStorage.removeItem(key);
          }
        }
      }

      function configureSongsBackend(config) {
        const scopeOrigin = `${window.location.origin}${SONGS_ADMIN_PATH}`;
        config.site_url = scopeOrigin;
        config.backend.base_url = scopeOrigin;
        config.backend.auth_endpoint = `${window.location.origin}${AUTH_ENDPOINT}`;
      }

      function storeSongsSession(user) {
        const payload = JSON.stringify({
          token: user.token,
          provider: "github",
          login: user.login,
          name: user.name,
        });

        localStorage.setItem("netlify-cms-user", payload);
        localStorage.setItem(`decap-cms-git-github-token:${REPO}`, user.token);
        localStorage.setItem(
          `decap-cms-git-github-user:${REPO}`,
          JSON.stringify(user)
        );
      }

      async function bootstrapSongsAuth() {
        const response = await fetch("/api/songs/bootstrap", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
        });

        if (!response.ok) {
          throw new Error("bootstrap failed");
        }

        storeSongsSession(await response.json());
      }

      function waitForCmsReady() {
        return new Promise((resolve, reject) => {
          const deadline = Date.now() + 20000;

          const timer = setInterval(() => {
            const root = document.getElementById("nc-root");
            if (!root) return;

            if (
              root.querySelector("a[href*='collections']") ||
              root.querySelector("[class*='CollectionMain']") ||
              root.querySelector("[class*='AppMainContainer']")
            ) {
              clearInterval(timer);
              resolve("ready");
              return;
            }

            const loginBtn = root.querySelector("button");
            if (loginBtn) {
              clearInterval(timer);
              resolve("login");
              return;
            }

            if (Date.now() > deadline) {
              clearInterval(timer);
              reject(new Error("timeout"));
            }
          }, 100);
        });
      }

      function openAuthPopup() {
        const width = 600;
        const height = 720;
        const left = window.screenX + Math.max(0, (window.outerWidth - width) / 2);
        const top = window.screenY + Math.max(0, (window.outerHeight - height) / 2);

        return window.open(
          `${window.location.origin}${AUTH_ENDPOINT}`,
          "cms_auth",
          `width=${width},height=${height},left=${left},top=${top},scrollbars=yes`
        );
      }

      async function authenticateSongs(notice) {
        let state = await waitForCmsReady();

        if (state === "ready") {
          return true;
        }

        const popup = openAuthPopup();
        if (!popup) {
          notice.textContent =
            "팝업이 차단되었습니다. 브라우저에서 팝업을 허용한 뒤 다시 시도하세요.";
          return false;
        }

        state = await waitForCmsReady();
        popup.close();
        return state === "ready";
      }

      async function startSongsAdmin() {
        ensureHashRoute();

        const notice = document.getElementById("notice");
        clearCmsAuth();

        const response = await fetch(`${SONGS_ADMIN_PATH}/config.yml`);
        const config = jsyaml.load(await response.text());

        if (isLocalHost()) {
          config.local_backend = {
            url: "http://localhost:8081/api/v1",
          };
        } else {
          configureSongsBackend(config);
          notice.textContent = "저장소에 연결 중... (GitHub 계정 불필요)";

          try {
            await bootstrapSongsAuth();
          } catch {
            // bootstrap 실패 시 CMS init 후 auth popup으로 재시도
          }
        }

        CMS.init({ config });

        if (!isLocalHost()) {
          try {
            const ok = await authenticateSongs(notice);
            if (!ok) {
              notice.textContent = `연결에 실패했습니다. ${TOKEN_HINT}`;
              return;
            }
          } catch {
            notice.textContent = `연결에 실패했습니다. ${TOKEN_HINT}`;
            return;
          }
        }

        notice.innerHTML =
          "<strong>노래책 전용 수정 페이지입니다.</strong> " +
          "GitHub 개인 계정 없이 바로 수정할 수 있습니다. 노래방 아카이브는 " +
          '<a href="/archive-admin">/archive-admin</a>에서 별도 관리합니다.';
      }

      onReady(function () {
        startSongsAdmin().catch(function () {
          document.getElementById("notice").textContent =
            `CMS를 불러오지 못했습니다. ${TOKEN_HINT}`;
        });
      });
    </script>
  </body>
</html>
