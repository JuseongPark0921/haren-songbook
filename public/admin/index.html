<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>하렌 노래책 관리</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f6f3fb;
        color: #3b1d6a;
      }
      #notice {
        padding: 12px 16px;
        background: rgba(59, 29, 106, 0.08);
        border-bottom: 1px solid rgba(59, 29, 106, 0.12);
        font-size: 0.9rem;
        line-height: 1.5;
      }
      #notice a {
        color: #3b1d6a;
        font-weight: 600;
      }
      #notice strong {
        color: #3b1d6a;
      }
      #nc-root section button {
        width: auto !important;
        min-width: 200px;
        max-width: 100%;
        height: auto !important;
        padding: 12px 28px !important;
        font-size: 14px !important;
        line-height: 1.4 !important;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="notice">
      <strong>노래책 전용 수정 페이지입니다.</strong>
      GitHub 개인 계정 없이 바로 수정할 수 있습니다. 노래방 아카이브는
      <a href="/archive-admin">/archive-admin</a>에서 별도 관리합니다.
    </div>
    <div id="nc-root"></div>

    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
    <script>
      const ADMIN_PATH = "/admin";
      const AUTH_PATH = "admin/auth";

      function isLocalHost() {
        return (
          window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1"
        );
      }

      function onReady(callback) {
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", callback);
        } else {
          callback();
        }
      }

      function ensureHashRoute() {
        if (!window.location.hash || window.location.hash === "#") {
          window.location.replace(
            window.location.pathname + window.location.search + "#/"
          );
        }
      }

      function clearCmsAuth() {
        for (const key of Object.keys(localStorage)) {
          if (
            key.includes("decap-cms") ||
            key.includes("netlify-cms") ||
            key.includes("github")
          ) {
            localStorage.removeItem(key);
          }
        }
      }

      function configureBackend(config) {
        config.site_url = `${window.location.origin}${ADMIN_PATH}`;
        config.backend.base_url = window.location.origin;
        config.backend.auth_endpoint = AUTH_PATH;
      }

      function isCmsAuthenticated(root) {
        if (
          root.querySelector("a[href*='collections']") ||
          root.querySelector("[class*='CollectionMain']") ||
          root.querySelector("[class*='AppMainContainer']") ||
          root.querySelector("[class*='Sidebar']") ||
          root.querySelector("nav")
        ) {
          return true;
        }

        const loginBtn = root.querySelector("button");
        return (
          !loginBtn &&
          root.children.length > 0 &&
          root.textContent.trim().length > 20
        );
      }

      function waitForCmsReady(timeoutMs) {
        return new Promise((resolve, reject) => {
          const deadline = Date.now() + timeoutMs;
          const timer = setInterval(() => {
            const root = document.getElementById("nc-root");
            if (!root) return;

            if (isCmsAuthenticated(root)) {
              clearInterval(timer);
              resolve("ready");
              return;
            }

            if (root.querySelector("button")) {
              clearInterval(timer);
              resolve("login");
              return;
            }

            if (Date.now() > deadline) {
              clearInterval(timer);
              reject(new Error("timeout"));
            }
          }, 100);
        });
      }

      function triggerCmsLogin() {
        const loginBtn = document.querySelector("#nc-root button");
        if (!loginBtn) return false;
        loginBtn.click();
        return true;
      }

      async function authenticateCms(notice) {
        let state = await waitForCmsReady(30000);
        if (state === "ready") return true;

        if (!triggerCmsLogin()) {
          notice.textContent = "CMS 로그인 버튼을 찾지 못했습니다.";
          return false;
        }

        try {
          state = await waitForCmsReady(30000);
          return state === "ready";
        } catch {
          return false;
        }
      }

      async function startAdmin() {
        ensureHashRoute();

        const notice = document.getElementById("notice");
        clearCmsAuth();

        const response = await fetch(`${ADMIN_PATH}/config.yml`);
        if (!response.ok) throw new Error("config load failed");

        const config = jsyaml.load(await response.text());

        if (isLocalHost()) {
          config.local_backend = { url: "http://localhost:8081/api/v1" };
        } else {
          configureBackend(config);
          notice.textContent = "저장소에 연결 중... 잠시만 기다려 주세요.";
        }

        CMS.init({ config });

        if (!isLocalHost()) {
          const ok = await authenticateCms(notice);
          if (!ok) {
            notice.textContent =
              "CMS 인증에 실패했습니다. 팝업이 닫힌 뒤 새로고침해 주세요.";
            return;
          }
        }

        notice.innerHTML =
          "<strong>노래책 전용 수정 페이지입니다.</strong> " +
          "GitHub 개인 계정 없이 바로 수정할 수 있습니다. 노래방 아카이브는 " +
          '<a href="/archive-admin">/archive-admin</a>에서 별도 관리합니다.';
      }

      onReady(function () {
        startAdmin().catch(function () {
          document.getElementById("notice").textContent =
            "CMS를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.";
        });
      });
    </script>
  </body>
</html>
