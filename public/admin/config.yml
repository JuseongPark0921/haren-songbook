backend:
  name: github
  repo: JuseongPark0921/haren-songbook
  branch: main
  # base_url is injected at runtime in index.html (window.location.origin)

locale: ko

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: songs
    label: 노래책
    label_singular: 곡
    folder: src/songlists/songs
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: title
    summary: "{{title}} - {{artist}}"
    sortable_fields:
      - title
      - artist
      - genre
    view_filters:
      - label: JPOP
        field: genre
        pattern: JPOP
      - label: KPOP
        field: genre
        pattern: KPOP
      - label: POP
        field: genre
        pattern: POP
      - label: 뮤지컬/성악
        field: genre
        pattern: 뮤지컬/성악
    fields:
      - label: 파일 ID
        name: slug
        widget: string
        required: true
        hint: "Markdown 파일명으로 사용됩니다 (예: cruel-angels-thesis.md). 변경하면 /song/[id] URL이 바뀝니다."
        pattern:
          - "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          - "URL-safe 문자만 사용하세요 (소문자, 숫자, 하이픈)"

      - label: 제목
        name: title
        widget: string
        required: true

      - label: 아티스트
        name: artist
        widget: string
        required: true

      - label: 장르
        name: genre
        widget: select
        required: true
        options:
          - JPOP
          - KPOP
          - POP
          - 뮤지컬/성악

      - label: Clip URL
        name: clip
        widget: string
        required: false
        hint: "하렌이 부른 치지직 클립 또는 대표 영상 링크"
        pattern:
          - "^(https?://.*)?$"
          - "http:// 또는 https:// 로 시작하는 URL을 입력하세요"

      - label: MR URL
        name: mr
        widget: string
        required: false
        hint: "MR(반주) 영상 링크"
        pattern:
          - "^(https?://.*)?$"
          - "http:// 또는 https:// 로 시작하는 URL을 입력하세요"

      - label: Covers
        name: covers
        widget: list
        required: false
        summary: "{{fields.title}}"
        fields:
          - label: Cover 제목
            name: title
            widget: string
            required: true
          - label: Cover URL
            name: url
            widget: string
            required: true
            pattern:
              - "^https?://.*"
              - "http:// 또는 https:// 로 시작하는 URL을 입력하세요"

      - label: 가사
        name: body
        widget: markdown
        required: false
        hint: "일본어 원문, 한글 발음, 번역 가사의 줄바꿈을 그대로 유지하세요"
