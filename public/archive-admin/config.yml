backend:
  name: github
  repo: JuseongPark0921/haren-songbook
  branch: main
  # base_url / auth_endpoint injected in index.html

locale: ko

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: archive
    label: 노래방 아카이브
    label_singular: 방송 아카이브
    folder: src/pages/Archive/archivedata
    create: true
    delete: true
    slug: "{{date}}"
    extension: json
    format: json
    identifier_field: date
    summary: "{{date}} — {{title}}"
    editor:
      preview: false
    sortable_fields:
      - title
      - date
    fields:
      - label: 방송 날짜 (파일 ID)
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        required: true
        default: "{{now}}"
        picker_utc: true
        hint: "새 방송을 추가할 때 날짜를 먼저 선택하세요. 파일명이 됩니다 (예: 2025-12-14.json)."

      - label: 방송 제목
        name: title
        widget: string
        required: false
        hint: "아카이브 목록에 표시되는 방송 제목. 비워두면 archive-index.json 또는 날짜가 표시됩니다."

      - label: 플랫폼
        name: platform
        widget: select
        required: true
        default: youtube
        options:
          - youtube
          - chzzk
        hint: "youtube: 곡 타임스탬프 클릭 시 영상 이동 / chzzk: 타임스탬프 클릭 미지원"

      - label: 다시보기 Embed URL
        name: embedUrl
        widget: string
        required: true
        hint: "iframe에 삽입되는 embed URL (예: https://www.youtube.com/embed/VIDEO_ID)"

      - label: 노래 목록
        name: songs
        widget: list
        required: true
        default: []
        summary: "{{fields.time}} {{fields.title}}"
        fields:
          - label: 타임스탬프
            name: time
            widget: string
            required: false
            default: TBD
            hint: "예: 1:26:40, 0:45:30 — 미정이면 TBD"

          - label: 곡 제목
            name: title
            widget: string
            required: true
