<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>노래방 아카이브 관리</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f6f3fb;
        color: #3b1d6a;
      }
      #notice {
        padding: 12px 16px;
        background: rgba(59, 29, 106, 0.08);
        border-bottom: 1px solid rgba(59, 29, 106, 0.12);
        font-size: 0.9rem;
        line-height: 1.5;
      }
      #notice a {
        color: #3b1d6a;
        font-weight: 600;
      }
      #notice strong {
        color: #3b1d6a;
      }
    </style>
  </head>
  <body>
    <div id="notice">
      <strong>노래방 아카이브 전용 수정 페이지입니다.</strong> 누구나 방송 기록을 수정할 수
      있습니다. 노래책(곡 가사·MR 등)은
      <a href="/admin">/admin</a>에서 비밀번호 + GitHub 권한으로 별도 관리합니다.
    </div>

    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
    <script>
      const ARCHIVE_ADMIN_PATH = "/archive-admin";

      function isLocalHost() {
        return (
          window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1"
        );
      }

      function clearCmsAuth() {
        for (const key of Object.keys(localStorage)) {
          if (
            key.includes("decap-cms") ||
            key.includes("netlify-cms") ||
            key.includes("github")
          ) {
            localStorage.removeItem(key);
          }
        }
      }

      function configureArchiveBackend(config) {
        const scopeOrigin = `${window.location.origin}${ARCHIVE_ADMIN_PATH}`;
        config.site_url = scopeOrigin;
        config.backend.base_url = scopeOrigin;
        config.backend.auth_endpoint = `${window.location.origin}/api/archive/auth`;
      }

      document.addEventListener("DOMContentLoaded", async function () {
        clearCmsAuth();

        const response = await fetch(`${ARCHIVE_ADMIN_PATH}/config.yml`);
        const configText = await response.text();
        const config = jsyaml.load(configText);

        if (isLocalHost()) {
          config.local_backend = {
            url: "http://localhost:8081/api/v1",
          };
        } else {
          configureArchiveBackend(config);
        }

        CMS.init({ config });
      });
    </script>
  </body>
</html>
