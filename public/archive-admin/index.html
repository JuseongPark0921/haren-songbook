<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>노래방 아카이브 관리</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f6f3fb;
        color: #3b1d6a;
      }
      #notice {
        padding: 12px 16px;
        background: rgba(59, 29, 106, 0.08);
        border-bottom: 1px solid rgba(59, 29, 106, 0.12);
        font-size: 0.9rem;
        line-height: 1.5;
      }
      #notice a {
        color: #3b1d6a;
        font-weight: 600;
      }
      #notice strong {
        color: #3b1d6a;
      }
    </style>
  </head>
  <body>
    <div id="notice">
      <strong>노래방 아카이브 전용 수정 페이지입니다.</strong>
      GitHub 개인 계정 없이 바로 수정할 수 있습니다. 노래책은
      <a href="/admin">/admin</a>에서 별도 관리합니다.
    </div>

    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
    <script>
      const ARCHIVE_ADMIN_PATH = "/archive-admin";
      const REPO = "JuseongPark0921/haren-songbook";

      function isLocalHost() {
        return (
          window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1"
        );
      }

      function clearCmsAuth() {
        for (const key of Object.keys(localStorage)) {
          if (
            key.includes("decap-cms") ||
            key.includes("netlify-cms") ||
            key.includes("github")
          ) {
            localStorage.removeItem(key);
          }
        }
      }

      function configureArchiveBackend(config) {
        const scopeOrigin = `${window.location.origin}${ARCHIVE_ADMIN_PATH}`;
        config.site_url = scopeOrigin;
        config.backend.base_url = scopeOrigin;
        config.backend.auth_endpoint = `${window.location.origin}/api/archive/auth`;
      }

      function storeArchiveSession(user) {
        const payload = JSON.stringify({
          token: user.token,
          provider: "github",
          login: user.login,
          name: user.name,
        });

        localStorage.setItem("netlify-cms-user", payload);
        localStorage.setItem(`decap-cms-git-github-token:${REPO}`, user.token);
        localStorage.setItem(
          `decap-cms-git-github-user:${REPO}`,
          JSON.stringify(user)
        );
      }

      async function bootstrapArchiveAuth() {
        const response = await fetch("/api/archive/bootstrap", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
        });

        if (!response.ok) {
          throw new Error("bootstrap failed");
        }

        const user = await response.json();
        storeArchiveSession(user);
      }

      function waitForCmsReady() {
        return new Promise((resolve, reject) => {
          const deadline = Date.now() + 12000;

          const timer = setInterval(() => {
            const root = document.getElementById("nc-root");
            if (!root) return;

            if (
              root.querySelector("a[href*='collections']") ||
              root.querySelector("[class*='CollectionMain']")
            ) {
              clearInterval(timer);
              resolve("ready");
              return;
            }

            const loginBtn = root.querySelector("button");
            if (loginBtn) {
              clearInterval(timer);
              resolve("login");
              return;
            }

            if (Date.now() > deadline) {
              clearInterval(timer);
              reject(new Error("timeout"));
            }
          }, 100);
        });
      }

      document.addEventListener("DOMContentLoaded", async function () {
        const notice = document.getElementById("notice");
        clearCmsAuth();

        const response = await fetch(`${ARCHIVE_ADMIN_PATH}/config.yml`);
        const configText = await response.text();
        const config = jsyaml.load(configText);

        if (isLocalHost()) {
          config.local_backend = {
            url: "http://localhost:8081/api/v1",
          };
        } else {
          configureArchiveBackend(config);
          notice.textContent = "저장소에 연결 중... (GitHub 계정 불필요)";

          try {
            await bootstrapArchiveAuth();
          } catch {
            notice.textContent =
              "연결에 실패했습니다. GITHUB_ARCHIVE_TOKEN 설정을 확인하세요.";
            return;
          }
        }

        CMS.init({ config });

        if (!isLocalHost()) {
          try {
            const state = await waitForCmsReady();
            if (state === "login") {
              const loginBtn = document.querySelector("#nc-root button");
              loginBtn?.click();
              await waitForCmsReady();
            }
          } catch {
            notice.textContent =
              "CMS 로드에 실패했습니다. 페이지를 새로고침해 주세요.";
            return;
          }
        }

        notice.innerHTML =
          "<strong>노래방 아카이브 전용 수정 페이지입니다.</strong> " +
          "GitHub 개인 계정 없이 바로 수정할 수 있습니다. 노래책은 " +
          '<a href="/admin">/admin</a>에서 별도 관리합니다.';
      });
    </script>
  </body>
</html>
