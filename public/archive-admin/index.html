<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>노래방 아카이브 관리</title>
    <script>
      if (!window.location.hash || window.location.hash === "#") {
        history.replaceState(
          null,
          "",
          window.location.pathname + window.location.search + "#/"
        );
      }
      window.CMS_MANUAL_INIT = true;
    </script>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f6f3fb;
        color: #3b1d6a;
      }
      #notice {
        padding: 12px 16px;
        background: rgba(59, 29, 106, 0.08);
        border-bottom: 1px solid rgba(59, 29, 106, 0.12);
        font-size: 0.9rem;
        line-height: 1.5;
      }
      #status {
        display: block;
        margin: 0;
        color: rgba(59, 29, 106, 0.75);
      }
      #notice .notice-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }
      #notice .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(59, 29, 106, 0.1);
        color: #3b1d6a;
        font-weight: 600;
        text-decoration: none;
        font-size: 0.85rem;
        white-space: nowrap;
      }
      #notice .back-link:hover {
        background: rgba(59, 29, 106, 0.18);
      }
      #notice a {
        color: #3b1d6a;
        font-weight: 600;
      }
      #notice strong {
        color: #3b1d6a;
      }
      #nc-root section button {
        width: auto !important;
        min-width: 200px;
        max-width: 100%;
        height: auto !important;
        padding: 12px 28px !important;
        font-size: 14px !important;
        line-height: 1.4 !important;
        white-space: nowrap;
      }

      /* Decap 상단 바 숨김: 콘텐츠 / 미디어 / 빠른 추가 */
      #nc-root [class*="AppHeader"],
      #nc-root [class*="AppHeaderContainer"],
      #nc-root > div > div > header,
      #nc-root a[href*="/media"],
      #nc-root a[href*="collections/media"],
      #nc-root [class*="QuickNew"],
      #nc-root [class*="SpeedDial"] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="notice">
      <div class="notice-row">
        <a href="/" class="back-link">← 노래책으로 돌아가기</a>
      </div>
      <p id="status"></p>
      <p>
        <strong>노래방 아카이브 전용 수정 페이지입니다.</strong>
        GitHub 개인 계정 없이 바로 수정할 수 있습니다. 노래책은
        <a href="/admin">/admin</a>에서 별도 관리합니다.
      </p>
    </div>
    <div id="nc-root"></div>

    <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
    <script>
      const ADMIN_PATH = "/archive-admin";
      const AUTH_PATH = "archive-admin/auth";
      let cmsInitialized = false;
      let cmsStarting = false;

      function isLocalHost() {
        return (
          window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1"
        );
      }

      function setStatus(message) {
        const status = document.getElementById("status");
        if (status) status.textContent = message || "";
      }

      function nextFrame() {
        return new Promise((resolve) => requestAnimationFrame(resolve));
      }

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function clearCmsAuth() {
        for (const key of Object.keys(localStorage)) {
          if (
            key.includes("decap-cms") ||
            key.includes("netlify-cms") ||
            key.includes("github")
          ) {
            localStorage.removeItem(key);
          }
        }
      }

      async function fetchCmsBranch() {
        try {
          const response = await fetch("/api/cms-branch");
          if (!response.ok) throw new Error("branch load failed");
          const data = await response.json();
          return data.branch || "main";
        } catch {
          return null;
        }
      }

      function configureBackend(config) {
        config.site_url = `${window.location.origin}${ADMIN_PATH}`;
        config.backend.base_url = window.location.origin;
        config.backend.auth_endpoint = AUTH_PATH;
      }

      function isCmsAuthenticated(root) {
        return Boolean(
          root.querySelector("a[href*='collections']") ||
            root.querySelector("[class*='CollectionMain']") ||
            root.querySelector("[class*='AppMainContainer']") ||
            root.querySelector("[class*='Sidebar']") ||
            root.querySelector("nav")
        );
      }

      function waitForCmsReady(timeoutMs) {
        return new Promise((resolve, reject) => {
          const deadline = Date.now() + timeoutMs;
          const timer = setInterval(() => {
            const root = document.getElementById("nc-root");
            if (!root) return;

            if (isCmsAuthenticated(root)) {
              clearInterval(timer);
              resolve("ready");
              return;
            }

            if (root.querySelector("button")) {
              clearInterval(timer);
              resolve("login");
              return;
            }

            if (Date.now() > deadline) {
              clearInterval(timer);
              reject(new Error("timeout"));
            }
          }, 100);
        });
      }

      function waitForGithubAuthSuccess(timeoutMs) {
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            window.removeEventListener("message", onMessage);
            reject(new Error("auth timeout"));
          }, timeoutMs);

          function onMessage(event) {
            if (
              typeof event.data === "string" &&
              event.data.indexOf("authorization:github:success:") === 0
            ) {
              clearTimeout(timer);
              window.removeEventListener("message", onMessage);
              resolve(true);
            }
          }

          window.addEventListener("message", onMessage);
        });
      }

      function triggerCmsLogin() {
        const loginBtn = document.querySelector("#nc-root button");
        if (!loginBtn) return false;
        loginBtn.click();
        return true;
      }

      async function authenticateCms() {
        let state = await waitForCmsReady(12000);
        if (state === "ready") return true;

        const authSuccess = waitForGithubAuthSuccess(30000);
        if (!triggerCmsLogin()) {
          setStatus("CMS 로그인 버튼을 찾지 못했습니다.");
          return false;
        }

        try {
          await authSuccess;
          await sleep(800);
          state = await waitForCmsReady(20000);
          return state === "ready";
        } catch {
          return false;
        }
      }

      async function startAdmin() {
        if (cmsInitialized || cmsStarting) return;
        cmsStarting = true;

        try {
          setStatus("CMS를 불러오는 중...");

          const response = await fetch(`${ADMIN_PATH}/config.yml`);
          if (!response.ok) throw new Error("config load failed");

          const config = jsyaml.load(await response.text());

          if (isLocalHost()) {
            config.local_backend = { url: "http://localhost:8081/api/v1" };
          } else {
            const cmsBranch = await fetchCmsBranch();
            if (!cmsBranch) throw new Error("branch load failed");
            config.backend.branch = cmsBranch;
            configureBackend(config);
            clearCmsAuth();
            setStatus("저장소에 연결 중... 잠시만 기다려 주세요.");
          }

          await nextFrame();
          await nextFrame();

          CMS.init({ config });
          cmsInitialized = true;
          cmsStarting = false;

          await sleep(400);

          if (!isLocalHost()) {
            const ok = await authenticateCms();
            if (!ok) {
              cmsInitialized = false;
              setStatus("CMS 인증에 실패했습니다. 페이지를 새로고침해 주세요.");
              return;
            }
          }

          setStatus("");
        } catch (error) {
          cmsInitialized = false;
          cmsStarting = false;
          setStatus("CMS를 불러오지 못했습니다. 페이지를 새로고침해 주세요.");
          throw error;
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        startAdmin().catch(function () {
          setStatus("CMS를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.");
        });
      });
    </script>
  </body>
</html>
